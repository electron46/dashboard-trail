<!-- @dsCard group="Colors" viewport="700x150" name="Feedback fonctionnel" subtitle="Succès / erreur / alerte — usage système, pas brand" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;gap:12px;height:150px;font-family:var(--font-sans)">
<div style="flex:1;background:rgba(127,184,107,.14);border:1px solid var(--color-success);border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:flex-end;padding:12px"><div style="font-size:13px;font-weight:600;color:var(--color-success)">Succès</div><div style="font-family:var(--font-mono);font-size:12px;color:var(--color-success)">#2F7A3D</div></div>
<div style="flex:1;background:rgba(216,121,111,.14);border:1px solid var(--color-danger);border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:flex-end;padding:12px"><div style="font-size:13px;font-weight:600;color:var(--color-danger)">Erreur</div><div style="font-family:var(--font-mono);font-size:12px;color:var(--color-danger)">#B3402C</div></div>
<div style="flex:1;background:rgba(210,168,90,.14);border:1px solid var(--color-warning);border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:flex-end;padding:12px"><div style="font-size:13px;font-weight:600;color:var(--color-warning)">Alerte</div><div style="font-family:var(--font-mono);font-size:12px;color:var(--color-warning)">#8A6D1B</div></div>
