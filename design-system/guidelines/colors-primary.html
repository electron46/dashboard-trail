<!-- @dsCard group="Colors" viewport="700x210" name="Surfaces & neutres" subtitle="Thème sombre — canvas puis trois paliers de surface" -->
<link rel="stylesheet" href="../styles.css">
<div style="height:210px;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:0 8px;font-family:var(--font-sans);background:var(--canvas)">
<div style="display:flex;gap:10px">
  <div style="flex:1"><div style="height:46px;border-radius:8px;background:var(--canvas);border:1px solid var(--border-subtle)"></div><div style="font-size:11px;color:var(--text-secondary);margin-top:6px;font-family:var(--font-mono)">#0C0F0E</div><div style="font-size:11px;color:var(--text-muted)">canvas</div></div>
  <div style="flex:1"><div style="height:46px;border-radius:8px;background:var(--surface-1);border:1px solid var(--border-subtle)"></div><div style="font-size:11px;color:var(--text-secondary);margin-top:6px;font-family:var(--font-mono)">#181D1B</div><div style="font-size:11px;color:var(--text-muted)">surface</div></div>
  <div style="flex:1"><div style="height:46px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border-subtle)"></div><div style="font-size:11px;color:var(--text-secondary);margin-top:6px;font-family:var(--font-mono)">#202622</div><div style="font-size:11px;color:var(--text-muted)">relevée</div></div>
  <div style="flex:1"><div style="height:46px;border-radius:8px;background:var(--surface-elevated);border:1px solid var(--border-subtle)"></div><div style="font-size:11px;color:var(--text-secondary);margin-top:6px;font-family:var(--font-mono)">#242B27</div><div style="font-size:11px;color:var(--text-muted)">élevée</div></div>
</div>
<div style="font-size:12px;color:var(--text-secondary);line-height:1.45">Neutres <strong style="color:var(--text-primary)">froids</strong>, jamais chauds. La profondeur vient du contraste de surface, pas du contour. Trois paliers au maximum.</div>
</div>
