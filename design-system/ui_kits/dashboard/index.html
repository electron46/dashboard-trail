<!-- @dsCard group="Dashboard" viewport="1100x760" name="Dashboard" subtitle="Suivi trail/running — recréation stylée du fichier fourni" -->
<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">
<title>ELEV — Dashboard</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--canvas)}a{color:var(--text-primary)}a:hover{color:var(--text-secondary)}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react" src="data.jsx"></script>
<script type="text/babel">
const { Button, IconButton, Card, Badge, Input, Table, MetricCard, Banner, Dialog, EmptyState, Tabs } = window.ELEVDesignSystem_bbdc25;

function fmtDate(iso){const [y,m,d]=iso.split('-');return d+'/'+m+'/'+y;}

function App(){
  const [detail,setDetail] = React.useState(null);
  const [search,setSearch] = React.useState('');
  const [importMsg,setImportMsg] = React.useState(null);
  const [tab,setTab] = React.useState('historique');

  const rows = SESSIONS.filter(s => !search || s.sport.toLowerCase().includes(search.toLowerCase()));

  return (
    <div style={{maxWidth:1040,margin:'0 auto',padding:'28px 20px 60px',fontFamily:'var(--font-sans)',color:'var(--text-primary)',display:'flex',flexDirection:'column',gap:20}}>
      <div>
        <div style={{fontSize:28,fontWeight:700,letterSpacing:'-0.02em'}}>ELEV</div>
        <div style={{fontSize:13,color:'var(--text-secondary)',marginTop:2}}>Suivi de préparation — Trail des Cascades &amp; Mafate Trail Tour</div>
      </div>

      <Card>
        <div style={{fontSize:15,fontWeight:600,marginBottom:12}}>Échéances</div>
        <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
          {RACES.map(r => <RaceChip key={r.name} race={r} />)}
        </div>
      </Card>

      <Card>
        <div style={{fontSize:15,fontWeight:600,marginBottom:12}}>Importer une séance (.fit)</div>
        <div style={{border:'2px dashed var(--border-subtle)',borderRadius:'var(--radius-md)',padding:24,textAlign:'center',color:'var(--text-secondary)',fontSize:14}}>
          Glissez vos fichiers .fit ici ou <Button size="sm" variant="secondary" onClick={()=>setImportMsg('ok')} style={{display:'inline-flex'}}>choisir des fichiers</Button>
        </div>
        {importMsg==='ok' && <div style={{marginTop:10}}><Banner tone="ok">2 séance(s) importée(s).</Banner></div>}
      </Card>

      <Card>
        <div style={{fontSize:15,fontWeight:600,marginBottom:12}}>Progression</div>
        <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
          <MetricCard label="Volume — 7 j" value="42,6" unit=" km" />
          <MetricCard label="D+ — 7 j" value="1860" unit=" m" />
          <MetricCard label="Allure moy." value="5'34" unit="/km" />
          <MetricCard label="FC moy." value="149" unit=" bpm" />
        </div>
      </Card>

      <Card>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12,flexWrap:'wrap',gap:10}}>
          <Tabs items={[{value:'historique',label:'Historique'},{value:'plan',label:'Plan'}]} active={tab} onChange={setTab} />
          {tab==='historique' && <div style={{width:220}}><Input placeholder="Rechercher (type, sport...)" value={search} onChange={e=>setSearch(e.target.value)} /></div>}
        </div>
        {tab==='historique' ? (
          rows.length ? (
            <Table
              columns={[
                {key:'date',label:'Date',render:s=>fmtDate(s.date)},
                {key:'sport',label:'Type'},
                {key:'distance',label:'Distance',mono:true},
                {key:'dplus',label:'D+',mono:true},
                {key:'duree',label:'Durée',mono:true},
                {key:'allure',label:'Allure',mono:true},
              ]}
              rows={rows}
              onRowClick={setDetail}
            />
          ) : <EmptyState title="Aucune séance ne correspond à la recherche." />
        ) : (
          <EmptyState title="Aucun plan importé pour l'instant." hint="Collez ou importez un CSV pour comparer vos séances au plan." />
        )}
      </Card>

      <div style={{display:'flex',gap:10}}>
        <Button variant="secondary" size="sm">Exporter (JSON)</Button>
        <Button variant="danger" size="sm">Réinitialiser</Button>
      </div>

      <Dialog open={!!detail} title={detail ? 'Séance du ' + fmtDate(detail.date) : ''} onClose={()=>setDetail(null)}>
        {detail && (
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
              <MetricCard label="Type" value={detail.sport} />
              <MetricCard label="Distance" value={detail.distance} />
              <MetricCard label="D+" value={detail.dplus} />
              <MetricCard label="Durée" value={detail.duree} />
              <MetricCard label="Allure moy." value={detail.allure} />
              <MetricCard label="FC moyenne" value={detail.fc} />
            </div>
            <Banner tone="info">Aucune séance planifiée trouvée pour cette date (ou plan non importé).</Banner>
            <Button size="sm">Générer le retour IA</Button>
          </div>
        )}
      </Dialog>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
