<!DOCTYPE html>
<html lang="fr" class="auth-pending">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accueil — ELEV Dashboard Trail</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B0F0E">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/app.js"></script>
</head>
<body>
<script>
// Première visite : aucune séance locale, aucun nom de profil, onboarding jamais terminé
// -> on envoie vers l'accueil du produit avant qu'il n'affiche des cartes vides.
(function redirectToOnboardingIfNeeded() {
  try {
    if (localStorage.getItem('trail:onboardingDone')) return;
    const hasData = loadIndex().length > 0 || !!(getProfile().nom || '').trim();
    if (hasData) { localStorage.setItem('trail:onboardingDone', '1'); return; }
    location.replace('onboarding.html');
  } catch (e) {}
})();
</script>

<div class="app-shell">
<aside class="sidebar">
  <div class="sidebar-brand">
    <img class="brand-mark" src="https://unpkg.com/lucide-static@latest/icons/mountain-snow.svg" alt="">
    <div class="brand-word"><strong>ELEV</strong><span>Trail Intelligence</span></div>
  </div>
  <nav class="sidebar-nav" id="sidebarNav"></nav>
  <div class="sidebar-user" id="sidebarUser"></div>
</aside>
<div class="app-main">
<!-- Topbar volontairement allégée sur l'Accueil (voir header.app-topbar--slim) : la salutation
     reste présente mais cesse d'être le premier bloc dominant — le paysage démarre presque
     immédiatement sous la navigation. -->
<header class="app-topbar app-topbar--slim">
  <div>
    <h1 id="greetingTitle">Bonjour 👋</h1>
  </div>
  <div class="app-topbar-actions">
    <a class="btn accent" href="historique.html">+ Importer une activité</a>
    <button id="themeToggle" type="button">☀</button>
  </div>
</header>

<main>

  <div id="gearAlertBox"></div>

  <!-- Home Rail : les 3 grands moments de la narration (État actuel → Paysage d'entraînement →
       Objectif). Chaque `.rail-stop` est FULL-BLEED : il annule le centrage de <main> par des
       marges négatives (--bleed-l/--bleed-r, affinées par initHomeBleed) et se redonne seulement
       des marges intérieures de sécurité (--scene-pad). C'est toute la composition qui occupe le
       canvas, pas seulement les images de fond.
       Les fonds photographiques sont des éléments STATIQUES du rail (jamais régénérés par un
       render) : ils restent donc visibles quoi qu'il arrive côté données — seul le contenu
       dépendant des données est reconstruit. -->
  <div class="home-rail">

    <div class="rail-stop rail-stop--hero">
      <!-- ELEV Terrain Backdrop : environnement du hero. Layer A = vraie photo de relief
           (décorative, alt="") ; Layer B = dégradés de fusion (vignette + fondu vers #0B0F0E,
           jamais de ligne nette) ; Layer C = topographie très discrète (elevMountainBackdropSvg,
           contourOnly). Le vrai ELEV Terrain Profile (donnée réelle) vit dans .pulse-terrain. -->
      <div class="terrain-backdrop" id="terrainBackdrop" aria-hidden="true">
        <img class="tb-photo" alt="" src="assets/images/elev-hero-mountain.webp" fetchpriority="high" decoding="async">
        <div class="tb-photo-mask"></div>
        <div id="terrainBackdropSvgLayer"></div>
      </div>
      <!-- CURRENT STATE : Performance Pulse — données distribuées dans tout le canvas (readiness
           à gauche, métriques au centre/à droite, profil altimétrique dans le tiers bas). -->
      <section class="pulse-scene" aria-label="État actuel" id="pulseScene"></section>
    </div>

    <div class="rail-stop rail-stop--split reveal-on-scroll">
      <!-- Fond atmosphérique statique de la scène (couvre toute la largeur du rail, y compris la
           colonne de droite) — voir .landscape-bg-wrap. -->
      <div class="landscape-bg-wrap" aria-hidden="true">
        <img class="landscape-bg" src="assets/images/elev-secondary-dark.webp" alt="" loading="lazy" decoding="async">
        <div class="landscape-bg-mask"></div>
      </div>
      <!-- TRAINING LANDSCAPE + ELEV INSIGHT : la tendance occupe toute la place, l'insight naît
           du graphique via un connecteur plutôt que de vivre dans une card à part. -->
      <section class="landscape-scene" aria-label="Paysage d'entraînement" id="landscapeScene"></section>

      <div class="landscape-side">
        <!-- NEXT CHECKPOINT : un point sur une trajectoire, pas une card. -->
        <div class="checkpoint-strip" id="checkpointStrip"></div>
        <section class="card">
          <h2>Dernière activité</h2>
          <div id="lastActivityBox"></div>
        </section>
      </div>
    </div>

    <div class="rail-stop rail-stop--summit reveal-on-scroll">
      <!-- TARGET SUMMIT : destination de la narration. Le sommet photographique est un élément
           statique : il reste visible même si aucun GPX n'a été importé (seul le profil réel du
           parcours dépend de cette donnée). -->
      <div class="summit-bg-wrap" aria-hidden="true">
        <img class="summit-bg" src="assets/images/elev-target-summit.webp" alt="" loading="lazy" decoding="async">
        <div class="summit-bg-mask"></div>
      </div>
      <section class="summit-scene" aria-label="Objectif principal" id="summitScene"></section>
    </div>

  </div>

  <div class="dash-secondary-grid dash-full reveal-on-scroll">
    <section class="card card-compact">
      <h2>Charge d'entraînement <small>(12 sem.)</small></h2>
      <div id="loadChartBox"></div>
    </section>
    <section class="card card-compact">
      <h2>Intensité <small>(30 derniers jours)</small></h2>
      <div id="fcSummaryBox"></div>
    </section>
  </div>

</main>

<footer class="app">Dashboard local — aucune donnée envoyée ailleurs que l'API Anthropic (si clé renseignée dans Paramètres).</footer>
</div>
</div>

<nav class="mobile-nav" id="mobileNav"></nav>

<script>
function renderGearAlert() {
  const box = document.getElementById('gearAlertBox');
  const alerts = getGear().filter(g => g.actif !== false).map(g => {
    const km = (g.kmInitial || 0) + gearKmFromSessions(g.id);
    const seuil = g.seuilKm || 700;
    return { nom: g.nom, pct: Math.round((km / seuil) * 100) };
  }).filter(a => a.pct >= 80).sort((a,b) => b.pct - a.pct);
  if (!alerts.length) { box.innerHTML = ''; return; }
  const worst = alerts[0];
  const cls = worst.pct >= 100 ? 'danger' : 'warn';
  const msg = alerts.map(a => escapeHtml(a.nom) + ' (' + a.pct + '%)').join(', ');
  box.innerHTML = '<div class="alert-banner ' + cls + '">⚠ Usure chaussures à surveiller : ' + msg + ' — <a href="equipements.html">voir la page Équipements</a></div>';
}

/* --------------------------- SALUTATION --------------------------- */
function renderGreeting() {
  const profile = getProfile();
  const prenom = (profile.nom || '').trim().split(/\s+/)[0];
  document.getElementById('greetingTitle').textContent = prenom ? ('Bonjour ' + prenom + ' 👋') : 'Bonjour 👋';

  // Avatar généré à partir de l'initiale du prénom (pas de photo) — reste discret si le profil est vide.
  const initial = prenom ? prenom[0].toUpperCase() : '?';
  document.getElementById('sidebarUser').innerHTML =
    '<div class="avatar">' + escapeHtml(initial) + '</div>' +
    '<div class="user-info"><strong>' + escapeHtml(prenom || 'Ton profil') + '</strong><a href="profil.html">Voir mon profil</a></div>';
}

/* --------------------------- DONNÉES PARTAGÉES --------------------------- */
// N'affiche que des indicateurs réellement calculables à partir des données de l'app (pas de score
// "état de forme" ou "récupération" — ces données ne sont pas suivies aujourd'hui, voir README).
function mainObjectiveRace() {
  const today = new Date().toISOString().slice(0,10);
  const upcoming = getRaces().filter(r => r.date >= today).sort((a,b) => a.date.localeCompare(b.date));
  if (!upcoming.length) return null;
  const principal = upcoming.find(r => r.statut === 'principal');
  return principal || upcoming[0];
}
const ICON = n => 'https://unpkg.com/lucide-static@latest/icons/' + n + '.svg';

/* --------------------------- CURRENT STATE : PERFORMANCE PULSE ---------------------------
   Remplace l'ancienne grille de cards KPI par une scène continue : le terrain réel de la
   dernière sortie (profil d'altitude, jamais un relief inventé) sert de fond très discret aux
   indicateurs, qui restent du texte normal dans le flux du DOM (lisible sans animation, sans
   dépendre du SVG pour l'information — voir CLAUDE.md, Phase 2 "Performance Pulse"). */
function renderPulse() {
  const box = document.getElementById('pulseScene');
  box.classList.add('scene');
  if (!loadAllSessions().length) {
    box.innerHTML = '<div class="empty-state"><div class="empty-title">Commence ton suivi</div>' +
      '<p>Importe ta première activité pour voir apparaître tes indicateurs (volume, tendance de charge, préparation à ton objectif).</p>' +
      '<a class="btn small accent" href="historique.html">Importer ma première activité</a></div>';
    return;
  }
  const stats = getWeeklyStats();
  const sessions = loadAllSessions();
  const lastSession = sessions[sessions.length - 1];
  const race = mainObjectiveRace();
  const readiness = race ? computeRaceReadiness(race) : null;

  // ELEV Terrain Profile de la dernière sortie. La série est passée au VALIDATEUR partagé
  // (validateTerrainSeries) avec ses vrais couples distance/altitude : X = distance cumulée,
  // jamais l'index du point (une série FIT est échantillonnée dans le temps — tracer par index
  // donnait un profil temps/altitude, bug corrigé lors de cette passe). Si la série n'est pas
  // exploitable (pas d'altitude, distances incohérentes, relief plat), AUCUN profil n'est dessiné :
  // on affiche un état vide honnête plutôt qu'un faux relief. Les repères Départ/Point culminant/
  // Arrivée sont les points réels de la série (premier / altitude max / dernier) — aucun
  // checkpoint inventé, aucune donnée de ravitaillement n'existant côté activité importée.
  let terrainHtml = '';
  const rawSeries = lastSession && Array.isArray(lastSession.series)
    ? lastSession.series.filter(p => p.alt != null && p.distKm != null) : [];
  const terrain = validateTerrainSeries(rawSeries);
  if (terrain) {
    terrainHtml =
      '<div class="pulse-terrain">' +
        elevTerrainProfile(terrain, { height: 230, variant: 'hero', className: 'terrain-profile--hero', eagerBackdrop: true }) +
        '<p class="terrain-hint">Survole le profil (ou explore-le au clavier avec ←/→) pour lire la distance et l\'altitude.</p>' +
      '</div>';
  } else if (lastSession) {
    terrainHtml =
      '<div class="pulse-terrain"><p class="terrain-empty">Pas de profil altimétrique pour ta dernière sortie ' +
      '(' + escapeHtml(fmtDayMonth(lastSession.date)) + ') : le fichier ne contient pas de série altitude/distance exploitable.</p></div>';
  }

  const arrow = pct => pct == null ? '' : '<span class="arrow">' + (pct >= 0 ? '▲' : '▼') + '</span>';
  const heroSub = stats.distanceDeltaPct != null
    ? arrow(stats.distanceDeltaPct) + (stats.distanceDeltaPct >= 0 ? '+' : '') + stats.distanceDeltaPct + '% vs sem. précédente'
    : 'Cette semaine';

  // Hiérarchie extrême : UNE seule information domine le hero, dans le tiers gauche. La
  // préparation à l'objectif (readiness) prend le pas sur le volume quand elle est calculable —
  // c'est la donnée la plus synthétique. Sinon, repli honnête sur le volume hebdomadaire : jamais
  // de readiness affiché sans être réellement calculé.
  const hasReadiness = race && readiness && readiness.overall != null;
  const dominantHtml = hasReadiness
    ? '<div class="pulse-hero-metric pulse-hero-metric--dominant">' +
        '<span class="v">' + readiness.overall + '<small>%</small></span>' +
        '<span class="l">prêt pour <strong>' + escapeHtml(race.name) + '</strong></span>' +
      '</div>'
    : '<div class="pulse-hero-metric pulse-hero-metric--dominant">' +
        '<span class="v">' + fmtNum(stats.distanceKm, ' km', 1) + '</span>' +
        '<span class="l' + (stats.distanceDeltaPct != null && stats.distanceDeltaPct >= 0 ? ' status-ok' : '') + '">' + heroSub + '</span>' +
      '</div>';

  // Si la readiness domine le hero, le volume redescend au rang de métrique secondaire (avec les
  // autres) plutôt que d'être répété deux fois — jamais deux informations dominantes à la fois.
  // Ces métriques sont réparties sur le centre et la droite du canvas, jamais posées sur la ligne
  // du profil (voir .pulse-main / .pulse-floating-metrics).
  const secondaryMetrics = [
    hasReadiness ? { v: fmtNum(stats.distanceKm, ' km', 1), l: 'Volume · ' + heroSub.replace(/<[^>]+>/g, '') } : null,
    { v: fmtNum(stats.ascent, ' m', 0), l: 'D+ cette semaine' },
    { v: fmtDuration(stats.durationS), l: 'Temps d\'effort' },
    { v: String(stats.sessionsCount), l: 'Sorties' },
  ].filter(Boolean);

  // NOTE : la tendance de charge hebdomadaire ("Stable — sur tes 4 dernières semaines") a été
  // retirée d'ici. Elle ne décrit pas le parcours altimétrique affiché juste en dessous : sa place
  // est à côté du graphique d'évolution du volume (voir renderLandscape / .landscape-trend-tag).
  box.innerHTML =
    '<div class="pulse-content">' +
      '<h2 class="visually-hidden">État actuel</h2>' +
      '<div class="pulse-eyebrow">' +
        '<span class="elev-signal"><img src="' + ICON('activity') + '" alt="">État actuel</span>' +
      '</div>' +
      '<div class="pulse-main">' +
        '<div class="pulse-lead">' + dominantHtml + '</div>' +
        '<div class="pulse-floating-metrics">' +
          secondaryMetrics.map(m => '<div class="floating-metric"><span class="v">' + m.v + '</span><span class="l">' + escapeHtml(m.l) + '</span></div>').join('') +
        '</div>' +
      '</div>' +
    '</div>' +
    terrainHtml;
  initTerrainProfiles(box);
}

/* --------------------------- TRAINING LANDSCAPE + ELEV INSIGHT ---------------------------
   Fusionne "Cette semaine", la tendance et l'Insight ELEV en une seule scène : l'insight
   s'accroche visuellement au graphique (connecteur + delta chiffré) plutôt que de vivre dans
   une card séparée ailleurs sur la page. Fenêtre limitée à l'historique réellement disponible
   (getRecentWeeklyVolumes) : une semaine sans séance avant le début du suivi n'est jamais
   affichée comme "0 km". */
let trendMetric = 'km';
function renderLandscape() {
  const box = document.getElementById('landscapeScene');
  box.classList.add('scene');
  const stats = getWeeklyStats();
  if (!stats) {
    box.innerHTML = '<h2>Paysage d\'entraînement</h2><div class="empty">Importe des séances (page Activités) pour voir ce résumé.</div>';
    return;
  }
  const items = [
    ['route', 'Distance', fmtNum(stats.distanceKm, ' km', 1)],
    ['mountain-snow', 'D+', fmtNum(stats.ascent, ' m', 0)],
    ['clock', 'Durée', fmtDuration(stats.durationS)],
    ['flag', 'Sorties', String(stats.sessionsCount)],
  ];
  const weekGrid = items.map(([icon,lbl,val]) =>
    '<div class="week-stat"><img src="' + ICON(icon) + '" alt=""><div><div class="l">'+lbl+'</div><div class="v">'+val+'</div></div></div>'
  ).join('');

  const weeks = getRecentWeeklyVolumes(12);
  let chartHtml, insightHtml;
  if (weeks.length < 2) {
    chartHtml = svgEmpty('Évolution du volume');
    insightHtml = '';
  } else if (weeks.length === 2) {
    // Deux semaines ne font pas une tendance : on ne surdimensionne pas une droite de 2 points.
    // On montre honnêtement les deux valeurs, leur écart et la moyenne (même règle d'honnêteté
    // que l'état de repli des graphiques de la page Analyse).
    const isKm = trendMetric === 'km';
    const val = w => isKm ? w.km : w.dplus;
    const unit = isKm ? ' km' : ' m';
    const dec = isKm ? 1 : 0;
    const a = val(weeks[0]), b = val(weeks[1]);
    const delta = b - a;
    const avg = (a + b) / 2;
    chartHtml = '<div class="landscape-thin">' +
      '<div class="lt-item"><span class="v">' + fmtNum(a, unit, dec) + '</span><span class="l">Sem. du ' + escapeHtml(fmtDate(weeks[0].startISO)) + '</span></div>' +
      '<div class="lt-item"><span class="v">' + fmtNum(b, unit, dec) + '</span><span class="l">Sem. du ' + escapeHtml(fmtDate(weeks[1].startISO)) + '</span></div>' +
      '<div class="lt-item"><span class="v">' + (delta >= 0 ? '+' : '') + fmtNum(delta, unit, dec) + '</span><span class="l">Écart</span></div>' +
      '<div class="lt-item"><span class="v">' + fmtNum(avg, unit, dec) + '</span><span class="l">Moyenne des 2 sem.</span></div>' +
      '</div>' +
      '<p class="hint" style="margin:8px 0 0;">Deux semaines renseignées seulement : pas encore assez pour tracer une tendance fiable.</p>';
    const insight = generateElevInsight();
    insightHtml = insight
      ? '<div class="landscape-callout status-' + insight.level + '"><span class="dot" aria-hidden="true"></span>' +
        '<div class="body"><span class="elev-signal"><img src="' + ICON('zap') + '" alt="">Insight ELEV</span>' +
        '<strong>' + escapeHtml(insight.title) + '</strong><p>' + escapeHtml(insight.text) + '</p></div></div>'
      : '';
  } else {
    const isKm = trendMetric === 'km';
    const points = weeks.map((w,i) => ({
      x: i, y: +(isKm ? w.km : w.dplus).toFixed(1), xLabel: w.shortLabel,
      label: 'Semaine du ' + fmtDate(w.startISO) + ' : ' + (isKm ? w.km.toFixed(1) + ' km' : Math.round(w.dplus) + ' m D+'),
    }));
    chartHtml = lineChartSvg('', points, { decimals: isKm ? 1 : 0, height: 220, hideTitle: true });

    const insight = generateElevInsight();
    const trend = getTrainingTrend();
    if (insight && trend) {
      // Le delta annoté vient du même calcul que le texte (charge aiguë vs chronique) — jamais un
      // second chiffre inventé pour illustrer.
      const deltaPct = trend.chronic > 0 ? Math.round(((trend.acute - trend.chronic) / trend.chronic) * 100) : null;
      insightHtml = '<div class="landscape-callout status-' + insight.level + '">' +
        '<span class="dot" aria-hidden="true"></span>' +
        '<div class="body">' +
          '<span class="elev-signal"><img src="' + ICON('zap') + '" alt="">Insight ELEV</span>' +
          '<strong>' + escapeHtml(insight.title) + '</strong>' +
          '<p>' + escapeHtml(insight.text) + (deltaPct != null ? ' <strong class="delta">(' + (deltaPct >= 0 ? '+' : '') + deltaPct + '% vs moyenne 4 sem.)</strong>' : '') + '</p>' +
        '</div>' +
      '</div>';
    } else {
      insightHtml = '<div class="empty" style="margin-top:14px;">Importe au moins deux semaines de séances pour obtenir un insight.</div>';
    }
  }

  // Tendance de charge : sa place est ICI (à côté de l'évolution du volume dans le temps), pas sur
  // le profil altimétrique du hero — elle décrit les semaines écoulées, pas un parcours.
  const trend = getTrainingTrend();
  const trendSubs = {
    rising: 'par rapport à ta moyenne récente',
    rising_fast: 'à surveiller',
    stable: 'sur tes 4 dernières semaines',
    falling: 'par rapport à tes semaines précédentes',
  };
  const trendStatus = { rising: 'ok', rising_fast: 'warn', stable: 'ok', falling: null };
  const trendTag = trend
    ? '<div class="landscape-trend-tag"><span class="kpi-status-dot' + (trendStatus[trend.level] ? ' status-' + trendStatus[trend.level] : '') + '"></span>' +
      '<span><strong>' + escapeHtml(trend.label) + '</strong> — ' + escapeHtml(trendSubs[trend.level]) + '</span></div>'
    : '';

  // Le fond atmosphérique de la scène est statique dans index.html (il ne dépend d'aucune donnée) :
  // il n'est plus reconstruit ici, donc il ne peut plus disparaître lors d'un re-rendu.
  box.innerHTML =
    '<div class="landscape-content">' +
    '<h2>Paysage d\'entraînement</h2>' +
    '<div class="week-stats-inline">' + weekGrid + '</div>' +
    '<div class="trend-subhead">' +
      // Libellé de fenêtre dynamique : on n'annonce jamais "12 dernières semaines" quand
      // l'historique réellement disponible est plus court (même règle que les pages Analyse/Objectifs).
      '<div><h3>Évolution du volume</h3><p class="hint">' +
        (weeks.length >= 12 ? '12 dernières semaines'
          : weeks.length > 1 ? escapeHtml(weeks.length + ' semaines renseignées')
          : 'Historique trop court') + '</p>' + trendTag + '</div>' +
      '<div class="period-select" id="trendMetricSelect">' +
        '<button type="button" data-metric="km" class="' + (trendMetric === 'km' ? 'active' : '') + '">Volume</button>' +
        '<button type="button" data-metric="dplus" class="' + (trendMetric === 'dplus' ? 'active' : '') + '">D+</button>' +
      '</div>' +
    '</div>' +
    '<div id="trendChartBox" style="margin-top:8px;">' + chartHtml + '</div>' +
    insightHtml +
    '<a class="link-arrow trend-link" href="historique.html">Voir toute l\'analyse de tendance →</a>' +
    '</div>';

  initChartTooltips(document.getElementById('trendChartBox'));
  box.querySelectorAll('#trendMetricSelect button').forEach(btn => btn.addEventListener('click', () => {
    trendMetric = btn.dataset.metric;
    renderLandscape();
  }));
}

/* --------------------------- NEXT CHECKPOINT --------------------------- */
// Bande fine plutôt qu'une card encadrée classique de plus : la prochaine séance apparaît sur
// un segment de trajectoire.
function renderCheckpoint() {
  const box = document.getElementById('checkpointStrip');
  const today = new Date().toISOString().slice(0,10);
  const plan = getPlan();
  const nextPlanned = plan ? plan.filter(p => p.date >= today).sort((a,b)=>a.date.localeCompare(b.date))[0] : null;
  if (!nextPlanned) {
    box.innerHTML = '<p class="eyebrow">Prochaine séance</p><div class="empty">Importe un plan (page Paramètres) pour voir ta prochaine séance.</div>';
    return;
  }
  const bloc = getCurrentBloc();
  const isToday = nextPlanned.date === today;
  const pills = [
    nextPlanned.distanceKm ? fmtNum(nextPlanned.distanceKm, ' km', 1) : null,
    nextPlanned.deniveleM ? fmtNum(nextPlanned.deniveleM, ' m D+', 0) : null,
    isToday ? 'Aujourd\'hui' : fmtDate(nextPlanned.date),
  ].filter(Boolean).map(p => '<span class="next-session-pill">' + escapeHtml(p) + '</span>').join('');
  box.innerHTML =
    '<p class="eyebrow">Prochaine séance</p>' +
    '<div class="checkpoint-track"><span class="dot"></span></div>' +
    '<div class="checkpoint-body">' +
      '<strong>' + escapeHtml(nextPlanned.type || 'Séance') + '</strong>' +
      (bloc ? '<span class="next-session-bloc">' + escapeHtml(bloc) + '</span>' : '') +
      '<div class="checkpoint-pills">' + pills + '</div>' +
    '</div>' +
    '<div style="margin-top:12px;"><a class="btn small" href="plan.html">Voir le plan →</a></div>';
}

/* --------------------------- DERNIÈRE ACTIVITÉ --------------------------- */
function renderLastActivity() {
  const box = document.getElementById('lastActivityBox');
  const sessions = loadAllSessions();
  if (!sessions.length) {
    box.innerHTML = '<div class="empty-state"><div class="empty-title">Commence ton suivi</div>' +
      '<p>Importe une première activité .fit pour découvrir tes statistiques et tendances.</p>' +
      '<a class="btn small accent" href="historique.html">Importer une activité</a></div>';
    return;
  }
  const s = sessions[sessions.length - 1];
  // Libellé d'affichage déterministe (sport + date) — jamais le nom de fichier brut de la montre.
  const label = (s.sport || 'Séance') + ' — ' + fmtDayMonth(s.date);
  const stats = [
    ['route', fmtNum(s.distanceKm, ' km', 1), 'Distance'],
    ['mountain-snow', fmtNum(s.ascent, ' m D+', 0), 'Dénivelé'],
    ['clock', fmtDuration(s.durationS), 'Durée'],
    s.avgPaceSecPerKm != null ? ['gauge', fmtPace(s.avgPaceSecPerKm), 'Allure'] : null,
    s.avgHr != null ? ['heart-pulse', s.avgHr + ' bpm', 'FC moy.'] : null,
  ].filter(Boolean);
  const visual = sessionPreviewSvg(s);
  box.innerHTML = '<a class="activity-card-link" href="historique.html#s=' + encodeURIComponent(s.id) + '"><div class="activity-card">' +
    (visual ? '<div class="activity-visual">' + visual + '</div>' : '') +
    '<div class="activity-info">' +
      '<div class="hint">' + fmtDate(s.date) + (s.dateApprox ? ' *' : '') + '</div>' +
      '<h3>' + escapeHtml(label) + '</h3>' +
      '<div class="activity-stats">' + stats.map(([icon,v,l]) => '<div class="activity-stat"><img src="' + ICON(icon) + '" alt=""><strong>' + v + '</strong><span>' + l + '</span></div>').join('') + '</div>' +
      '<span class="link-arrow" style="margin-top:12px;">Voir l\'analyse →</span>' +
    '</div>' +
  '</div></a>';
}

/* --------------------------- TARGET SUMMIT (objectif principal) --------------------------- */
function renderSummit() {
  const box = document.getElementById('summitScene');
  box.classList.add('scene');
  const today = new Date().toISOString().slice(0,10);
  const r = mainObjectiveRace();
  if (!r) {
    box.innerHTML = '<div class="empty-state"><div class="empty-title">Aucun objectif défini</div>' +
      '<p>Ajoute une course pour suivre ta préparation.</p>' +
      '<a class="btn small accent" href="objectifs.html">Ajouter un objectif</a></div>';
    return;
  }
  const days = Math.ceil((new Date(r.date) - new Date(today)) / 86400000);
  const readiness = computeRaceReadiness(r);

  // Scène principale = la DESTINATION : nom, compte à rebours, distance, D+, readiness. Les
  // métriques sont distribuées au centre/à droite comme dans le hero, jamais empilées en barres.
  const metrics = [
    { v: 'J-' + days, l: fmtDate(r.date), cls: 'summit-metric--countdown' },
    { v: fmtNum(r.distanceKm, ' km', 0), l: 'Distance' },
    { v: fmtNum(r.denivele, ' m', 0), l: 'Dénivelé positif' },
    readiness.overall != null ? { v: readiness.overall + '%', l: 'de préparation', cls: 'summit-metric--readiness' } : null,
  ].filter(Boolean);
  const metricsHtml = metrics.map(m =>
    '<div class="summit-metric' + (m.cls ? ' ' + m.cls : '') + '"><span class="v">' + escapeHtml(m.v) + '</span><span class="l">' + escapeHtml(m.l) + '</span></div>'
  ).join('');

  // Profil réel de l'objectif : uniquement si un GPX a été importé (page Objectifs → import GPX)
  // ET si sa série passe la validation partagée. Jamais de relief inventé — mais le PAYSAGE
  // (photo de sommet, élément statique du rail) reste visible dans tous les cas : seule la courbe
  // dépend des données, jamais l'environnement visuel.
  const objectiveTerrain = validateTerrainSeries(Array.isArray(r.gpxProfile) ? r.gpxProfile : null);
  let objectiveProfileHtml;
  if (objectiveTerrain) {
    objectiveProfileHtml = '<div class="summit-profile">' +
      elevTerrainProfile(objectiveTerrain, { height: 210, variant: 'hero', className: 'terrain-profile--summit' }) +
      '<p class="terrain-hint">Survole le profil de la course (ou explore-le au clavier avec ←/→).</p>' +
    '</div>';
  } else {
    objectiveProfileHtml = '<p class="summit-no-profile"><strong>Le terrain de cette course n\'est pas encore connu</strong>' +
      'Importe la trace GPX de l\'épreuve depuis <a href="objectifs.html">la page Objectifs</a> pour afficher son vrai profil altimétrique ici.</p>';
  }

  // Sous-scores : zone analytique secondaire, repliée — ils ne dominent plus la scène.
  let subsHtml = '';
  if (readiness.overall != null) {
    const weakest = readiness.subs.filter(s => s.score != null).sort((a, b) => a.score - b.score)[0];
    subsHtml = '<details class="summit-subscores">' +
      '<summary>Détail de ma préparation <span class="hint">' +
        (weakest ? 'point faible : ' + escapeHtml(weakest.label.toLowerCase()) : '5 sous-scores') + '</span></summary>' +
      '<div class="summit-subscores-body"><div class="obj-subs">' + readiness.subs.map(sub => {
        const pct = sub.score != null ? sub.score : 0;
        return '<div class="obj-sub-row" title="' + escapeHtml(sub.detail) + '">' +
          '<span>' + escapeHtml(sub.label) + '</span>' +
          '<div class="obj-sub-track"><div class="obj-sub-fill" style="width:' + pct + '%"></div></div>' +
          '<span class="obj-sub-val">' + (sub.score != null ? sub.score + '%' : '—') + '</span>' +
        '</div>';
      }).join('') + '</div></div>' +
    '</details>';
  } else {
    subsHtml = '<p class="hint" style="margin:4px 0 0;">Pas encore assez de données pour calculer l\'indice de préparation.</p>';
  }

  box.innerHTML =
    '<div class="summit-head">' +
      '<div class="summit-title">' +
        '<p class="summit-eyebrow"><img src="' + ICON('target') + '" alt="">' + statutLabel(r.statut) + '</p>' +
        '<h3>' + escapeHtml(r.name) + '</h3>' +
      '</div>' +
      '<div class="summit-metrics">' + metricsHtml + '</div>' +
    '</div>' +
    objectiveProfileHtml +
    '<div class="summit-actions"><a class="btn small" href="objectifs.html">Voir mon objectif →</a></div>' +
    subsHtml;
  initTerrainProfiles(box);
}

/* --------------------------- ANALYSES SECONDAIRES --------------------------- */
function renderLoadChart() {
  const box = document.getElementById('loadChartBox');
  const weeks = getRecentWeeklyVolumes(12);
  if (weeks.length < 2) { box.innerHTML = svgEmpty('Charge d\'entraînement'); return; }
  weeks.forEach((w, i) => {
    const windowVals = weeks.slice(Math.max(0,i-3), i+1).map(x => x.km);
    w.chronic = +(windowVals.reduce((a,b)=>a+b,0) / windowVals.length).toFixed(1);
  });
  const series = [
    { name: 'Aiguë (semaine)', color: 'var(--accent)', values: weeks.map(w => +w.km.toFixed(1)) },
    { name: 'Chronique (moy. 4 sem.)', color: 'var(--secondary)', values: weeks.map(w => w.chronic) },
  ];
  box.innerHTML = groupedBarChartSvg('', weeks, series, { height: 170, hideTitle: true });
  initChartTooltips(box);
}

// Répartition du temps passé par zone FC sur les 30 derniers jours — lecture seule sur l'Accueil
// (FC max / FC repos se règlent en page Profil, qui reste la source unique de ces deux valeurs).
function renderFcSummary() {
  const box = document.getElementById('fcSummaryBox');
  const profile = getProfile();
  const zones = getActiveHrZones(profile);
  if (!zones) {
    box.innerHTML = '<div class="empty">Renseigne ta FC max et ta FC repos dans <a href="profil.html">ton profil</a> pour voir cette répartition.</div>';
    return;
  }
  const today = new Date().toISOString().slice(0,10);
  const d30 = new Date(); d30.setDate(d30.getDate() - 30);
  const c30 = d30.toISOString().slice(0,10);
  const sessions = loadAllSessions().filter(s => s.date >= c30 && s.date <= today && Array.isArray(s.series) && s.series.length >= 2);
  const zoneSeconds = zones.map(() => 0);
  let totalSeconds = 0;
  sessions.forEach(s => {
    const pts = s.series.filter(p => p.hr != null && p.t != null);
    for (let i = 1; i < pts.length; i++) {
      const dt = pts[i].t - pts[i-1].t;
      if (dt <= 0 || dt > 300) continue; // ignore les trous (pause, arrêt GPS...)
      const hr = (pts[i].hr + pts[i-1].hr) / 2;
      let zi = zones.findIndex(z => hr >= z.low && hr <= z.high);
      if (zi < 0) zi = hr < zones[0].low ? 0 : zones.length - 1;
      zoneSeconds[zi] += dt;
      totalSeconds += dt;
    }
  });
  if (!totalSeconds) {
    box.innerHTML = '<div class="empty">Pas assez de séances avec FC sur les 30 derniers jours.</div>';
    return;
  }
  box.innerHTML = zones.map((z, i) => {
    const pct = Math.round((zoneSeconds[i] / totalSeconds) * 100);
    return '<div style="margin-bottom:7px;">' +
      '<div class="row" style="justify-content:space-between;font-size:.78rem;"><span>' + escapeHtml(z.label) + '</span><span>' + pct + '%</span></div>' +
      '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%;"></div></div>' +
    '</div>';
  }).join('');
}

  renderGreeting();

  renderPulse();

try { renderAppNav(); } catch (e) { console.error('Navigation partagee indisponible :', e); }

initScrollReveal(); // révélation progressive des scènes sous le pli (IntersectionObserver, non bloquant)
initHeroTerrainTransition(); // transition "mountain → terrain → data" au scroll (jamais de scroll détourné)
initHomeBleed(); // Hero/Training Landscape/Target Summit : composition ET fonds pleine largeur réelle
// Rappelé par assets/authgate.js une fois la session confirmée, après avoir resynchronisé les
// séances depuis Supabase (source de vérité) — voir syncActivitiesWithSupabase() dans app.js.
async function onAuthReady() { await syncActivitiesWithSupabase(); renderAll(); }
